name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Ajouter le lecteur de code-barres
        run: |
          npm pack html5-qrcode@2.3.8
          tar xzf html5-qrcode-2.3.8.tgz
          cp package/html5-qrcode.min.js app/src/main/assets/www/

      - name: Compiler
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk HalalScan.apk

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: HalalScan-apk
          path: HalalScan.apk

      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Halal Scan v1.${{ github.run_number }}
          files: HalalScan.apk
          make_latest: true
